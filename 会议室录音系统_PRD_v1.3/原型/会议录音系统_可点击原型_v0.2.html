function tablet(){return `<div class="tablet-stage"><div class="tablet-label"><span>${ico('tablet',14)} 安卓平板 · 公用操作界面</span><span>${pageId()} ${chip('交互演示')}</span></div><div class="tablet-frame"><section class="tablet"><div class="tablet-top"><div class="tablet-brand"><span class="room-icon">${ico('mic',21)}</span>会议室 A <span class="small muted" style="font-weight:400;margin-left:5px">会议记录</span></div><div class="tablet-status"><span>${ico(S.online?'wifi':'offline',15)} ${S.online?'网络正常':'网络已断开'}</span><span>${ico('database',15)} 24.6 GB 可用</span><span>${ico('battery',18)} 86% · 供电中</span></div></div>${S.phase==='ready'?padIdle():['recording','paused'].includes(S.phase)?padRecording():S.phase==='queue'?padQueue():padSaved()}<div class="tablet-bottom"><div class="row gap8">${ico('shield',15)}<span>仅采集音频 · 普通操作不显示历史会议内容</span></div><div class="row gap8"><button class="queue-link" data-action="pad-queue">${ico('upload',14)}本机待处理 ${S.queue.filter(q=>!q.uploaded).length}</button>${button('管理入口','pad-manage','sm ghost','lock')}</div></div></section></div></div>`}
function defaultRoute(){return S.restricted?'本场限制分享，不向群发送':S.scenario==='unconfigured'?'尚未配置接收规则，仅保存等待配置':({review:'整理后等待审核 · 管理层测试群',auto:'整理完成后自动发送 · 管理层测试群',archive:'仅保存归档，不向群发送'}[S.rulePublished])}
function padIdle(){return `<div class="tablet-body"><div class="idle-main"><div class="kicker">READY FOR YOUR NEXT MEETING</div><h1>开始这场会议</h1><p class="idle-sub">点一下开始，结束后自动整理。<br>不用登录、填表或手动上传。</p><button class="record-orb" data-action="start" aria-label="开始录音">${ico('mic',49)}</button><div class="start-label">开始录音</div><div class="row gap8 mt8 small muted">${ico('checkCircle',14)}麦克风、存储与离线授权已就绪（演示）</div>${!S.online?`<div class="mt16 w100">${banner('当前离线，仍可录音。本地保存后等待网络恢复。','amber','offline')}</div>`:''}</div><aside class="tablet-guide"><div class="guide-card"><h3>结束以后，系统会继续完成</h3><div class="guide-steps"><div class="guide-step"><span class="step-num">1</span><div><p>保存录音</p><small>先保存在平板，不依赖网络</small></div></div><div class="guide-step"><span class="step-num">2</span><div><p>整理会议资料</p><small>逐字稿、纪要和行动事项</small></div></div><div class="guide-step"><span class="step-num">3</span><div><p>${S.rulePublished==='auto'?'发送会议摘要':S.rulePublished==='archive'?'按权限归档':'按规则通知管理层'}</p><small>群内摘要 + 授权查看入口</small></div></div></div></div><div class="privacy-card"><div class="row between"><h4 class="row gap8">${ico('lock',15)}本场限制分享</h4><button class="switch ${S.restricted?'on locked':''}" data-action="restrict" aria-label="${S.restricted?'本场已限制分享':'开启本场限制分享'}" aria-pressed="${S.restricted}"></button></div><p>${S.restricted?'已收紧：禁止群发。解除限制需业务授权。':'开启后只收紧本场分享，不改其他会议。'}<br>限制分享不等于本地 AI，数据去向单独管理。</p></div><div class="small muted" style="padding:0 6px;line-height:1.9">${ico('info',13)} 当前分享范围（演示配置）<br><strong style="font-weight:500;color:#657b67">${defaultRoute()}</strong><br>AI 路线未定；本原型不向任何服务传输数据。</div></aside></div>`}
function wave(paused=false){return `<div class="waveform ${paused?'paused':''}" aria-label="模拟输入波形">${Array.from({length:62},(_,i)=>`<span style="height:${8+((i*17+Math.sin(i*.6)*23+31)%48)}px;--i:${i}"></span>`).join('')}</div>`}
function padRecording(){const paused=S.phase==='paused';return `<div class="record-area"><div class="record-title ${paused?'paused':''}"><span class="pulse-dot"></span>${paused?'录音已暂停':'正在录音'} ${chip('状态模拟')}</div><div class="timer mono" id="timer">${fmt(S.elapsed,true)}</div><div class="small muted">实际录音时长（演示） <span style="margin:0 9px;color:#c4cec3">|</span> 会议经过 <span id="wall" class="mono">${fmt(S.wall,true)}</span></div>${wave(paused)}<div class="input-caption">${paused?'暂停期间不采集声音；继续后仍属于同一场会议。':'声音输入正常（示意波形，不采集麦克风）'}</div><div class="record-controls">${button(paused?'继续录音':'暂停录音',paused?'resume':'pause','',paused?'play':'pause')}<button class="btn red end-hold" id="end-record" aria-label="长按一秒结束并保存" title="按住 1 秒结束；键盘按住空格或回车">${ico('stop',17)}长按结束并保存</button></div><p class="record-helper">按住 1 秒，防止误触。无需再次确认，也不会删除已录内容。</p><div class="record-notice">${!S.online?banner('网络已断开，录音继续保存在平板；结束后自动等待补传。','amber','offline'):S.restricted?banner('本场已限制分享，不会向企业微信群发送。AI 处理是否可用由独立策略决定。','amber','lock'):banner(`当前规则：${defaultRoute()}。停止录音后，您可以离开。`,'','shield')}</div></div>`}
function stageInfo(){if(S.phase==='saving')return {title:'正在保存录音',sub:'正在封存本地文件，请稍候。',text:'此时尚未确认保存完成。',current:0};if(S.scenario==='interrupted')return {title:'录音已中断，已保护可恢复片段',sub:'存在未采集区间，不能视为完整会议。',text:'已停止自动分发，管理员需要检查。不会自动重开麦克风。',current:0};if(!S.online&&S.stage<2)return {title:'录音已保存到本机',sub:'可以离开，也可以开始下一场会议。',text:'网络恢复后自动上传；目前尚未到服务器，也尚未发送。',current:1};if(S.restricted)return {title:'录音已保存，限制分享已生效',sub:'本场仅归档，群消息已被禁止。',text:S.stage>=2?'原音频已归档；AI 数据策略未配置，暂不处理。':'本地文件已保存，正在等待服务器接收。',current:Math.min(2,S.stage)};if(S.stage===1)return {title:'录音已保存到本机',sub:'可以离开，无需等待上传和整理。',text:'正在自动上传；本地文件保留，尚未完成服务器校验。',current:1};if(S.stage===2)return {title:'原始录音已归档',sub:'服务器已完整接收并校验。',text:'正在生成逐字稿、纪要和行动事项（模拟）。',current:2};if(S.scenario==='unconfigured')return {title:'会议资料已生成',sub:'录音、逐字稿、纪要和行动事项已就绪。',text:'接收规则未配置，系统不会猜测群。请管理员完成配置。',current:3};if(S.globalPause)return {title:'会议资料已生成',sub:'全局停发已生效。',text:'录音及纪要已保留，尚未向任何群发送。',current:3};if(S.rulePublished==='archive')return {title:'会议资料已归档',sub:'本场规则为仅归档。',text:'授权人员可在后台查阅；不会发送群消息。',current:3};if(S.rulePublished==='auto'&&S.stage>=4)return {title:'处理完成，渠道已接收',sub:'演示流程已完成；没有发送任何真实消息。',text:'渠道已接收不等于管理者已读；完整记录仍需登录授权。',current:4};return {title:'会议资料已生成，等待审核',sub:'无需在平板上继续操作。',text:'业务审核者确认内容和目标后发送；目前尚未发送。',current:3}}
function padSaved(){const x=stageInfo();return `<div class="tablet-body"><div class="saved-main"><div class="saved-icon" style="${S.scenario==='interrupted'?'color:var(--amber);background:var(--amber-bg)':''}">${ico(S.scenario==='interrupted'?'alert':S.phase==='saving'?'database':'check',36)}</div><h1>${x.title}</h1><p>${x.sub}</p><div class="small muted mt8">本场录音 <span class="mono">${fmt(S.elapsed,true)}</span> · REC-DEMO-001 · 示例状态</div><div class="process">${['本机保存','上传校验','AI 整理','按规则分发'].map((t,i)=>`<div class="process-step ${i<x.current?'done':i===x.current?'current':''}"><div class="node">${i<x.current?ico('check',15):ico(['database','upload','spark','send'][i],15)}</div><div>${t}</div><small class="tiny">${i<x.current?'已完成':i===x.current?(i===1&&!S.online?'待网络':i===3?'未发送':'处理中'):'待处理'}</small></div>`).join('')}</div><div class="saved-callout">${x.text}</div><div class="mt24">${button('返回首页，准备下一场','new-meeting','primary','arrow')}</div></div></div>`}
function padQueue(){return `<div class="queue-wrap"><div class="row between mb16"><div><h2>本机待处理记录</h2><p class="muted small mt8">只显示编号与处理状态，不展示历史标题、正文和回放入口。</p></div>${button('返回','pad-back','sm','back')}</div>${S.queue.length?S.queue.map((q,i)=>`<div class="queue-row"><span class="file-icon">${ico('file',19)}</span><div class="qmeta"><strong class="small mono">REC-DEMO-${String(i+1).padStart(3,'0')}</strong><p class="small muted">本次演示 · 录音时长 ${fmt(q.duration,true)}</p></div>${chip(q.uploaded?'服务器已接收':q.interrupted?'需管理员检查':'待网络补传',q.uploaded?'green':'amber')}</div>`).join(''):`<div class="empty-card">${ico('checkCircle',38)}<h3 class="mt16">目前没有待处理记录</h3><p class="small mt8">结束录音后，系统会自动处理上传。</p></div>`}${banner('维护和查看会议内容是不同权限。需要诊断时，请通过管理入口认证。','blue','lock')}</div>`}
function sidebar(){const entries=hasContent()?[['list','file','会议记录'],['exceptions','alert','异常与待处理'],['rules','split','分发规则'],['devices','tablet','会议室与设备'],['access','users','用户组织与权限'],['settings','gear','处理与存储'],['audit','history','操作记录']]:[['devices','tablet','会议室与设备'],['exceptions','alert','异常与待处理'],['rules','split','分发规则'],['access','users','用户组织与权限'],['settings','gear','处理与存储'],['audit','history','操作记录']];return `<aside class="sidebar"><div class="workspace-name"><div class="workspace-avatar">会</div><div><strong class="small">公司会议空间</strong><p class="tiny muted">1 间会议室 · 内部试点</p></div></div><div class="nav-group-label">工作空间</div>${entries.map(([v,i,t],j)=>`${j===2?'<div class="nav-group-label">管理与配置</div>':''}<button class="side-link ${S.view===v||(S.view==='detail'&&v==='list')?'active':''}" data-action="nav-${v}">${ico(i,17)}${t}${v==='exceptions'?'<span class="side-count">3</span>':''}</button>`).join('')}<div class="sidebar-bottom"><div class="row gap8">${ico('shield',16)}全程演示数据</div><p class="mt8">真实 AI、群发送和删除均关闭。<br>权限表现仅用于评审，不构成安全实现。</p><div class="sidebar-version">PRD 1.1-draft · UI 0.2</div></div></aside>`}
function consoleView(){if(!actor()||actor().status!=='active')return iamLogin();return `<div class="console">${sidebar()}<section class="workspace-main"><div class="breadcrumb row between"><span>公司会议空间 <span style="margin:0 7px">/</span> ${ {list:'会议记录',detail:'会议详情',rules:'分发规则',devices:'会议室与设备',exceptions:'异常与待处理',access:'用户组织与权限',settings:'处理与存储',audit:'操作记录'}[S.view]||''}</span><span class="row gap8"><span class="avatar">${S.role==='admin'?'管':S.role==='viewer'?'阅':'审'}</span>${esc(actor()?.name)} · 演示 ${button('退出','iam-logout','sm')}${button('模拟过期','iam-expire','ghost sm')}</span></div>${S.view==='list'?meetingList():S.view==='detail'?detail():S.view==='rules'?rules():S.view==='devices'?devices():S.view==='exceptions'?exceptions():S.view==='access'?iamWorkspace():S.view==='settings'?settings():audit()}</section></div>`}
function distColor(d){return d.includes('接收')?'green':d.includes('禁止')||d.includes('阻断')?'red':d.includes('审核')||d.includes('确认')?'amber':''}
function meetingList(){if(!hasContent())return denied(false);let records=S.records.filter(r=>S.filter==='all'||(S.filter==='review'?r.type==='review':S.filter==='problem'?['failed','unknown','incomplete'].includes(r.type):r.type==='sent')).filter(r=>(r.title+r.id).includes(S.search));return `<div class="heading-row"><div><h1>会议记录</h1><p>让每次讨论都有记录，让每个决定有据可查。</p></div><div class="row gap8">${chip('仅展示授权范围','green')}${button('刷新','refresh-list','','refresh')}</div></div><div class="stats"><div class="stat"><div class="label">${ico('file',14)}示例会议</div><div class="value">6<span class="unit">场</span></div><div class="sub">用于展示不同处理状态</div></div><div class="stat"><div class="label">${ico('edit',14)}等待审核</div><div class="value">${S.approved?'0':'1'}<span class="unit">场</span></div><div class="sub">核对内容后再分发</div></div><div class="stat"><div class="label">${ico('alert',14)}需要处理</div><div class="value">3<span class="unit">项</span></div><div class="sub">失败、中断及结果待确认</div></div><div class="stat"><div class="label">${ico('tablet',14)}会议室设备</div><div class="value">1<span class="unit">台</span></div><div class="sub">状态为演示，不是实时心跳</div></div></div>${banner('本页仅「泵组报价与交付协调」提供完整交互内容，使用 PRD 合成样例；其余记录用于展示状态，不代表真实会议。','','info')}<div class="filters"><div class="segments">${[['all','全部'],['review','待审核'],['problem','有异常'],['sent','已接收']].map(([v,t])=>`<button data-action="filter-${v}" class="${S.filter===v?'active':''}">${t}</button>`).join('')}</div><label class="search">${ico('search',15)}<input id="search-meeting" aria-label="搜索会议" placeholder="搜索会议标题或编号" value="${esc(S.search)}"></label></div><div class="table-shell"><table class="data-table"><thead><tr><th style="width:37%">会议</th><th>时间 / 时长</th><th>内容状态</th><th>分发状态</th><th></th></tr></thead><tbody>${records.map(r=>`<tr><td><div class="table-title-cell"><span class="file-icon">${ico(r.type==='restricted'?'lock':'file',18)}</span><div><button class="meeting-title" data-action="open-${r.id}">${esc(r.title)}</button><div class="meeting-sub">会议室 A · ${r.id} · ${r.tag}</div></div></div></td><td><div>${r.time}</div><div class="meeting-sub mono">${r.duration}</div></td><td><div class="small">${r.processing}</div><div class="mt8">${chip(r.integrity,r.integrity==='完整'?'':'amber')}</div></td><td>${chip(r.dist,distColor(r.dist))}</td><td><button class="icon-btn" data-action="open-${r.id}" aria-label="查看${esc(r.title)}">${ico('chevron',15)}</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty-card">未找到符合条件的授权记录。</div></td></tr>'}</tbody></table><div class="table-footer"><span>共 ${records.length} 条 · 演示资料</span><span>第 1 页 / 1 页</span></div></div><div class="mini-notice">${ico('info',14)} “渠道已接收”不是“管理者已读”。原始录音、AI 处理和分发任务独立记录结果。</div>`}
function denied(mobile=false){return `<div class="${mobile?'phone-login':'panel empty-card'}">${ico('lock',42)}<h2 class="mt16">${S.role==='none'||mobile?'无法访问此记录':'当前角色没有内容查看权限'}</h2><p class="muted small mt16">${mobile?'该记录不可用或当前账号没有访问权限。<br>请联系公司业务负责人确认。':'平台维护权限与会议内容权限分别授权。<br>这里不会显示会议标题、摘要或音频。'}</p>${mobile?'':button('查看设备状态','nav-devices','mt24','tablet')}</div>`}
function summaryContent(){return `<section class="section-card"><div class="section-head"><h3>${ico('spark',17)}会议概述</h3>${chip('v'+S.version+' · '+(S.version===1?'机器稿示例':'人工修订稿'))}</div><p class="summary-text">${esc(S.summary)}</p></section><section class="section-card"><div class="section-head"><h3>${ico('checkCircle',17)}明确决定</h3><span class="small muted">2 项 · 均可核对原文</span></div><div class="decision"><span class="check">${ico('check',14)}</span><div class="grow"><strong>报价维持 125,000 元</strong><p>更正前述金额，不采用 150,000 元。</p><button class="evidence-btn" data-action="evidence-3">${ico('play',11)} 原文 00:30 · seg-004</button></div></div><div class="decision"><span class="check">${ico('check',14)}</span><div class="grow"><strong>不批准额外采购备件</strong><p>30,000 元采购只是一项建议，不构成批准。</p><button class="evidence-btn" data-action="evidence-3">${ico('play',11)} 原文 00:30 · seg-004</button></div></div></section><section class="section-card"><div class="section-head"><h3>${ico('info',17)}尚未确定</h3>${chip('需要保留，不自动补全','amber')}</div><div class="question-row">P-208 交付日期待客户确认，不能承诺月底到货。</div><div class="question-row">客户资料核对的负责人、期限均未确定。</div><div class="question-row">“下周三”的具体日期需会后确认。</div></section>`}
function detail(){if(!hasContent())return denied();if(S.selected!=='MT-0921-001')return stateDetail();const r=S.records[0];return `<div class="heading-row detail-heading"><div><button class="text-btn small" data-action="nav-list">${ico('back',13)}会议记录</button><h1 class="mt8">泵组报价与交付协调</h1><div class="detail-meta"><span>${ico('clock',13)}2026-09-21 09:00 · 合成日期</span><span>${ico('tablet',13)}会议室 A</span><span>${ico('mic',13)}01:39 · 文本样例时间轴</span>${chip('合成样例')}</div></div><div class="row gap8">${S.role==='reviewer'?button('修订内容','edit-summary','','edit'):''}${S.role==='reviewer'?button(S.sent?'查看已发快照':S.approved?'分发预览':'审核与分发','review-send','primary','send'):chip('只读访问')}</div></div>${banner('这是预置的虚构会议文本，不来自你的录音。人物均为测试称呼；金额、负责人和日期需要核对原文。','blue','info')}<div class="detail-layout mt16"><div class="detail-main"><nav class="tabbar" aria-label="会议资料">${[['summary','会议纪要'],['transcript','逐字稿'],['tasks','行动事项 '+S.tasks.length],['audio','原始录音'],['versions','版本与记录']].map(([v,t])=>`<button class="${S.tab===v?'active':''}" data-action="tab-${v}">${t}</button>`).join('')}</nav>${S.stale?banner('逐字稿已有修订，当前纪要可能过时。需要重新核对，不能沿用原审核自动分发。','amber','alert'):''}${S.tab==='summary'?summaryContent():S.tab==='transcript'?transcript():S.tab==='tasks'?tasks():S.tab==='audio'?audio():versions()}</div><aside class="detail-side"><div class="panel"><h3>处理进度</h3><div class="timeline-item ok">原始录音已归档<p>完整性校验通过 · 示例状态</p></div><div class="timeline-item ok">逐字稿已生成<p>v${S.editSource?'2':'1'} · 10 段测试文本</p></div><div class="timeline-item ok">纪要与行动事项已生成<p>v${S.version} · ${S.approved?'已由演示审核者确认':'尚未人工确认'}</p></div><div class="timeline-item ${S.sent?'ok':'wait'}">${S.sent?'渠道已接收（模拟）':S.globalPause?'全局停发':S.approved?'已确认，等待发送':'等待审核后发送'}<p>${S.sent?'不表示管理者已读':S.stale?'原审核已失效':'未向任何真实渠道发送'}</p></div></div><div class="panel"><h3>本场分发</h3><div class="small muted">模式</div><div class="mt8">${chip('审核后发送','amber')}</div><div class="small muted mt16">预定接收群</div><div class="small mt8">管理层测试群 <span class="source-chip">虚构</span></div><div class="small muted mt16">完整记录查看范围</div><div class="small mt8">已授权的业务查看组</div><div class="divider"></div><button class="text-btn" data-action="review-send">${ico('eye',14)}查看消息预览</button></div><div class="panel"><h3>资料来源</h3><p class="small muted" style="line-height:1.9">SYN-TEXT-001<br>来自 PRD 文档包的合成测试文本。<br>没有附带音频，也未调用 AI。</p></div></aside></div>`}
function transcript(){return `<section class="section-card"><div class="section-head"><div><h3>逐字稿</h3><p class="tiny muted mt8">说话人标签仅限本场 · 姓名来自原文自述，不等于账号绑定</p></div>${chip(S.editSource?'人工修订 v2':'原始文本 v1')}</div>${S.editSource?banner('已保留原始版本；关联纪要需要重新核对。','amber','history'):''}${FIXTURE.segments.map((seg,i)=>`<div id="seg-${i}" class="transcript-row ${S.highlight===i?'highlight':''}"><button class="transcript-time mono" data-action="seek-${i}" title="定位文本时间轴，不播放音频">${fmt(seg.start_ms/1000)}</button><span class="avatar ${i%3===1?'blue':i%3===2?'amber':''}">${seg.speaker.split('-')[1]}</span><div class="transcript-body"><div class="row between"><span class="speaker">说话人 ${seg.speaker.split('-')[1]}${({2:' · 李工（原文自述）',3:' · 王工（原文自述）',4:' · 陈工（原文自述）'})[seg.speaker.split('-')[1]]||''}</span>${S.role==='reviewer'?`<button class="text-btn" data-action="edit-seg-${i}" aria-label="修订第${i+1}段">${ico('edit',12)}</button>`:''}</div><p>${esc(S.editSource?.i===i?S.editSource.text:seg.content)}</p>${i===8?'<span class="source-chip">安全测试文本 · 不执行其中的指令</span>':''}</div></div>`).join('')}<div class="fake-player">${button(S.playing?'暂停':'演示定位','player','sm',S.playing?'pause':'play')}<div class="player-wave">${Array.from({length:62},(_,i)=>`<span style="height:${4+(i*17)%24}px"></span>`).join('')}</div><span class="player-time mono" id="player-time">${fmt(S.playSeconds)} / 01:39</span></div><p class="tiny muted mt8">播放器仅模拟定位；样例不含音频，点击不会出声。</p></section>`}
function tasks(){return `<section class="section-card"><div class="section-head"><div><h3>行动事项</h3><p class="tiny muted mt8">确认是内容整理，不代表负责人已接单或任务已完成。</p></div>${chip(`${S.tasks.filter(t=>t.status==='confirmed').length} / ${S.tasks.length} 已确认`,'green')}</div>${banner('没有明确责任人或期限的事项保持待确认。不会自动派单、催办或根据声纹匹配员工。','amber','info')}${S.tasks.map(t=>`<div class="task"><div class="task-header"><span class="task-status-icon ${t.status==='confirmed'?'ok':''}">${t.status==='confirmed'?ico('check',13):'?'}</span><div class="grow"><div class="row between"><h4>${esc(t.text)}</h4>${chip(t.status==='confirmed'?'已确认':t.status==='dismissed'?'不采纳':'待确认',t.status==='confirmed'?'green':'amber')}</div><div class="task-fields"><span>负责人　<b>${esc(t.owner||'待确认')}</b></span><span>期限　<b>${esc(t.due||'待确认')}</b></span></div><p class="tiny muted">日期原文：${esc(t.dueText)} · ${t.manual?'含人工修订':'机器提取示意'} · 未绑定真实账号</p><div class="row between mt8"><button class="evidence-btn" data-action="evidence-${t.source}">${ico('play',11)}核对原文 ${fmt(FIXTURE.segments[t.source].start_ms/1000)}</button>${S.role==='reviewer'?`<div class="row gap8">${button('修订','edit-task-'+t.id,'sm','edit')}${button(t.status==='confirmed'?'撤销确认':'确认内容','confirm-task-'+t.id,'sm '+(t.status==='confirmed'?'':'soft'),'check')}</div>`:''}</div></div></div>`).join('')}</section>`}
function audio(){return `<section class="section-card"><div class="section-head"><h3>${ico('mic',18)}原始录音</h3>${chip('无样例音频','amber')}</div><div class="empty-card" style="padding:38px 18px">${ico('mic',38)}<h3 class="mt16">这里将提供原音频回放与时间定位</h3><p class="small muted mt8">本次沿用的 PRD 合成样例仅有文本，没有音频文件。<br>原型不会伪造“可回放”或音频校验成功的验证证据。</p><div class="row" style="justify-content:center;margin-top:23px">${button('播放原音频','noop','','play','disabled')}${button('下载原音频','noop','','download','disabled')}</div></div>${banner('正式产品中，播放、下载分别验证权限；原件、衍生播放文件和备份状态分别记录。','blue','shield')}</section><section class="section-card"><h3>文件信息（呈现示例）</h3><div class="metric-row"><span class="muted">录音标识</span><span class="mono">MT-0921-001</span></div><div class="metric-row"><span class="muted">时间轴范围</span><span>00:00 – 01:39（来自合成文本）</span></div><div class="metric-row"><span class="muted">实际文件 / 校验值</span><span>未提供 / 不展示虚构摘要</span></div><div class="metric-row"><span class="muted">备份验证</span>${chip('未执行')}</div></section>`}
function versions(){return `<section class="section-card"><div class="section-head"><h3>内容版本</h3>${chip('原版始终保留')}</div>${[...S.versions].reverse().map(v=>`<div class="audit-entry"><span class="avatar">v${v.v}</span><div class="grow"><strong class="small">${v.type}</strong><p>${esc(v.note)}</p><span class="tiny muted">${v.time}</span></div>${button('查看','view-version-'+v.v,'sm','eye')}</div>`).join('')}</section>${S.sentHistory.length?`<section class="section-card"><div class="section-head"><h3>已发送快照（模拟）</h3>${chip('不会被修订覆盖')}</div>${S.sentHistory.map((h,i)=>`<div class="audit-entry"><span class="avatar">v${h.version}</span><div><strong class="small">管理层测试群 · 第 ${i+1} 次模拟发布</strong><p>${esc(h.summary)}</p><span class="tiny muted">动作仅存在于本次原型，真实发送数为 0。</span></div></div>`).join('')}</section>`:''}<section class="section-card"><div class="section-head"><h3>本次演示操作</h3><span class="small muted">不是生产审计</span></div>${S.audit.length?S.audit.slice(0,12).map(a=>`<div class="audit-entry">${ico('history',15)}<div><strong class="small">${esc(a.action)}</strong><p>${esc(a.detail)}</p><span class="tiny muted">${a.time}</span></div></div>`).join(''):'<p class="muted small">目前没有修订或发送操作。可以先修订纪要并保存新版本。</p>'}</section>`}
function stateDetail(){let r=S.records.find(x=>x.id===S.selected);return `<div class="heading-row"><div><button class="text-btn" data-action="nav-list">${ico('back',14)}返回会议列表</button><h1 class="mt16">${esc(r.title)}</h1><p>${r.id} · ${r.time} · 只用于状态展示，无完整会议正文</p></div>${chip(r.dist,distColor(r.dist))}</div><div class="stats">${[['本地录音',r.integrity],['原件归档','已保存（示意）'],['AI 整理',r.processing],['群分发',r.dist]].map(([l,v])=>`<div class="stat"><div class="label">${l}</div><h3 class="mt16">${v}</h3></div>`).join('')}</div>${banner(r.type==='restricted'?'本场限制分享；外部 AI 策略尚未配置，保留原件，不调用云端。':r.type==='incomplete'?'录音存在缺口，不能补传后就清除缺口标记；自动分发已阻断。':r.type==='unknown'?'可能已经送达，但没有可靠响应。默认不重发，需要先核对，避免重复发群。':r.type==='failed'?'音频和逐字稿已保留，仅总结失败；恢复时不需要重新转写整场。':'演示渠道已接收，不意味着群成员已阅读或有权打开全文。',r.type==='sent'?'':'amber',r.type==='sent'?'info':'alert')}<div class="mt24 row">${button('查看异常与恢复','nav-exceptions','','alert')}${button('打开完整会议样例','open-MT-0921-001','primary','file')}</div>`}
function rules(){const can=S.role==='admin'||S.role==='reviewer';let mode=S.ruleMode;return `<div class="heading-row"><div><h1>分发规则</h1><p>先明确谁能收到摘要，再单独规定谁能查看完整记录。</p></div>${chip('仅操作演示配置','amber')}</div><div class="config-layout"><div class="stack"><section class="panel"><div class="section-head"><h3>会议室 A · 普通会议</h3>${chip('演示 v'+S.ruleVersion)}</div><p class="small muted mb16">具体生产规则尚未决定；这里用于比较操作方式。发布只作用后续新会议。</p><div class="radio-grid">${[['auto','send','自动发送','纪要生成后直接按规则分发'],['review','edit','审核后发送','业务审核者确认后再发送'],['archive','database','仅归档','保留记录，不发送群消息']].map(([v,i,t,d])=>`<button class="radio-card ${mode===v?'selected':''}" data-action="rule-${v}" ${can?'':'disabled'}><strong class="row gap8">${ico(i,16)}${t}</strong><p>${d}</p></button>`).join('')}</div><div class="field-row"><div><label class="field-label" for="rule-target">摘要接收群</label><select class="input" id="rule-target" ${mode==='archive'||!can?'disabled':''}><option value="test-management" ${S.target==='test-management'?'selected':''}>管理层测试群（虚构）</option><option value="none" ${S.target==='none'?'selected':''}>未配置</option></select><p class="field-help">不会在这里输入真实 Webhook。</p></div><div><label class="field-label">完整记录访问组</label><div class="input" style="background:#fafcf8">授权业务查看组（示例）</div><p class="field-help">收到群消息，不自动获得全文权限。</p></div></div><div class="config-row"><div><h4>本场限制分享优先</h4><p>公用平板可收紧，不能擅自扩大外发范围。</p></div>${chip('始终执行','green')}</div><div class="config-row"><div><h4>资料不完整 / 质量不足</h4><p>自动转为检查或审核，不按普通会议直接发群。</p></div>${chip('始终检查','amber')}</div><div class="config-row"><div><h4>保存后生效范围</h4><p>只影响新会议；不会把历史记录重新群发。</p></div>${chip('新会议')}</div><div class="row mt16">${button('保存为演示规则','save-rule','primary','check',can?'':'disabled')}${button('预演一次','preview-rule','','eye')}</div></section><section class="panel"><div class="row between"><div><h3>暂停所有群分发</h3><p class="small muted mt8">不影响录音、归档；恢复后需受控重评，不清空待发队列。</p></div><button class="switch ${S.globalPause?'on':''}" data-action="toggle-pause" aria-label="全局停发" aria-pressed="${S.globalPause}" ${can?'':'disabled'}></button></div></section></div><div class="stack"><section class="panel"><div class="section-head"><h3>${ico('eye',16)}规则预演</h3>${chip('零外部发送','green')}</div><label class="field-label" for="rule-sample">测试场景</label><select class="input" id="rule-sample">${[['normal','普通且完整的会议'],['restricted','本场限制分享'],['incomplete','录音存在缺口'],['unconfigured','没有接收群'],['conflict','同优先级规则冲突']].map(([v,t])=>`<option value="${v}" ${S.ruleSample===v?'selected':''}>${t}</option>`).join('')}</select><div class="setting-detail"><div class="step-explain"><span class="num">1</span><div>检查环境与全局开关<p>当前为原型，不产生真实发送。</p></div></div><div class="step-explain"><span class="num">2</span><div>检查本场分享限制<p>优先于普通会议的默认规则。</p></div></div><div class="step-explain"><span class="num">3</span><div>检查内容与目标权限<p>未知、冲突、不完整均不能猜测放行。</p></div></div><div class="step-explain" style="margin-bottom:0"><span class="num">4</span><div>形成版本化发送计划<p>审核绑定内容版本和接收目标。</p></div></div></div><div class="preview-result mt16"><div class="tiny muted mb16">按当前界面草稿计算的预期结果</div><h3>${ruleResult().title}</h3><p class="small muted mt8">${ruleResult().text}</p></div></section>${banner('仅归档、限制分享与禁止外部 AI 是不同的约束，不能互相替代。','amber','lock')}</div></div>`}
function ruleResult(){if(S.globalPause)return {title:'暂停分发',text:'全局停发优先，不发送任何新消息。'};if(S.ruleSample==='restricted')return{title:'禁止向群发送',text:'本场限制分享优先。资料按权限归档；AI 数据策略另行检查。'};if(S.ruleSample==='conflict')return{title:'规则冲突，已阻断',text:'不能取数据库返回的第一条，需配置负责人解决冲突。'};if(S.ruleMode==='archive')return {title:'仅归档',text:'四类资料按允许策略整理保存，不创建群发送任务。'};if(S.ruleSample==='unconfigured'||S.target==='none')return{title:'目标未配置，不发送',text:'不猜测或沿用其他会议的群；等待管理员配置。'};if(S.ruleSample==='incomplete')return{title:'需要人工检查',text:'已知录音缺口，自动发送规则不能直接放行。'};return S.ruleMode==='auto'?{title:'自动发送 · 仅模拟',text:'满足全部前置条件后，发管理层测试群的摘要和授权入口。'}:{title:'先审核，后发送',text:'授权审核者确认指定版本、目标和摘要后才可发送。'}}
function devices(){return `<div class="heading-row"><div><h1>会议室与设备</h1><p>设备运行信息与会议内容分开管理；未知状态不视为正常。</p></div>${button('刷新示例状态','refresh-device','','refresh')}</div><section class="panel"><div class="row between"><div class="row"><span class="room-icon" style="width:47px;height:47px">${ico('tablet',26)}</span><div><h2>会议室 A</h2><p class="small muted">首期一间 · 通常五人 · 中文会议</p></div></div>${chip(S.online?'在线（模拟）':'离线（模拟）',S.online?'green':'amber')}</div><div class="divider"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:30px"><div><div class="metric-row"><span class="muted">设备标识</span><span class="mono">PAD-DEMO-001</span></div><div class="metric-row"><span class="muted">设备型号 / 系统</span><span>待选真机 / 模拟环境</span></div><div class="metric-row"><span class="muted">最后上报</span><span>${S.devicesRefreshed?'刚刚（手动刷新示例）':'演示样例，不是实时遥测'}</span></div><div class="metric-row"><span class="muted">采集状态</span>${chip(['recording','paused'].includes(S.phase)?S.phase==='paused'?'已暂停':'录音中':'就绪',S.phase==='recording'?'red':'')}</div></div><div><div class="metric-row"><span class="muted">本机可用空间</span><strong>24.6 GB <span class="tiny muted">示意</span></strong></div><div class="progress-line"><b style="width:39%"></b></div><p class="tiny muted">使用 15.4 / 40.0 GB（虚构数据，不作容量依据）</p><div class="metric-row"><span class="muted">等待上传</span><span>${S.queue.filter(q=>!q.uploaded).length} 场</span></div><div class="metric-row"><span class="muted">身份与离线配置</span>${chip('有效 · 模拟','green')}</div></div></div><div class="divider"></div><div class="row wrap">${button('模拟断网 / 恢复','device-network','','wifi')}${button('查看待处理任务','nav-exceptions','','list')}${button('解绑条件说明','unbind-info','danger','logout')}</div></section><div class="mt16">${banner('本原型不提供远程开启麦克风；活动录音期间，不允许升级、清空数据或解绑。','blue','shield')}</div><section class="panel mt16"><h3>正式试点前仍需要验证</h3><div class="config-row"><div><h4>五人实际座位的收音效果</h4><p>包括最远座位、空调噪声和交替发言。</p></div>${chip('真机待验','amber')}</div><div class="config-row"><div><h4>熄屏、长录音、异常中断与恢复</h4><p>原型和模拟器均不能代替这些结果。</p></div>${chip('真机待验','amber')}</div></section>`}
function exceptions(){return `<div class="heading-row"><div><h1>异常与待处理</h1><p>分清哪个环节失败，只恢复受影响的任务。</p></div>${chip('只展示必要元数据')}</div>${banner('下列是故障处理交互示例，不是已执行的故障测试。维护角色不会看到会议正文。','blue','info')}<section class="panel mt16">${[['AI_SUMMARY_TIMEOUT','总结请求超时','MT-0921-003 · 原音频和逐字稿已保存','只重试总结；不重新转写整场。','retry-ai','重试总结','spark'],['SEND_RESULT_UNKNOWN','发送结果待确认','MT-0920-006 · 外部响应丢失，可能已送达','先核对目标群；不能按普通失败自动重发。','resolve-send','核对发送结果','send'],['CAPTURE_INTERRUPTED','录音中断，需要检查','MT-0920-005 · 已保留可恢复片段','00:06:12 – 00:07:04 为示例缺口，分发已阻断。','inspect-gap','查看恢复情况','mic']].map(([code,title,meta,desc,action,label,icon])=>`<div class="exception-row"><span class="exception-icon">${ico(icon,19)}</span><div><h4>${title}</h4><p>${meta}</p><p>${desc}</p><span class="source-chip mono">${code}</span></div><div>${button(label,action,'sm','chevron')}</div></div>`).join('')}</section><div class="mini-notice">暂停分发不暂停录音与归档。原件已经保存的情况下，AI 故障不会删除录音。</div>`}
function access(){return `<div class="heading-row"><div><h1>用户组织与权限</h1><p>页面角色为模拟切换；正式权限必须由服务器逐请求校验。</p></div>${chip('名单尚待批准','amber')}</div><section class="panel"><div class="section-head"><h3>角色权限示意</h3><span class="small muted">PRD / ACL-01</span></div><div class="table-shell"><table class="data-table permission-matrix"><thead><tr><th>行为</th><th>公用平板</th><th>授权查看者</th><th>业务审核者</th><th>平台管理员</th></tr></thead><tbody>${[['开始 / 暂停 / 结束','本设备','本设备','本设备','本设备'],['看历史会议内容','不可','按授权范围','按授权范围','默认不可'],['修改纪要 / 确认事项','不可','不可','显式授权','默认不可'],['审核 / 分发','不可','不可','显式授权','默认不可'],['维护设备与连接','不可','不可','另授配置权','可'],['下载原音频','不可','需另授下载权','需另授下载权','默认不可']].map(r=>`<tr>${r.map((c,i)=>`<td class="${c==='不可'||c==='默认不可'?'no':i?'yes':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><div class="config-layout mt16"><section class="panel"><h3>业务查看组（演示）</h3><p class="small muted mt8">仅为展示结构，不代表你已批准真实访问名单。</p><div class="metric-row"><span>内容范围</span><span>普通会议中的明确授权记录</span></div><div class="metric-row"><span>音频下载</span>${chip('需单独授予')}</div><div class="metric-row"><span>受限会议</span>${chip('不自动继承','amber')}</div></section><section class="panel"><h3>验证拒绝页面</h3><p class="small muted mt8">无权限时不展示标题、摘要或文件信息；群链接转发不自动授予权限。</p><div class="mt16">${button('查看无权访问示例','demo-denied','','lock')}</div></section></div>`}
function settings(){return `<div class="heading-row"><div><h1>处理与存储</h1><p>先比较云端、本地与混合方案，再批准首期配置。</p></div>${chip('AI 尚未选定','amber')}</div>${banner('本原型使用预置文本和纪要。不包含 AI 接口、密钥，也没有任何付费调用。','blue','shield')}<section class="panel mt16"><h3>AI 处理路线 · 待选方案</h3><div class="radio-grid mt16">${[['cloud','云端处理','音频与文本分别进入批准的云服务。'],['split','混合处理','例如本地转写、云端总结；文字仍会外发。'],['server','本地处理','公司服务器运行转写和总结，不要求平板运行大模型。']].map(([i,t,p])=>`<div class="radio-card"><strong class="row gap8">${ico(i,17)}${t}</strong><p>${p}</p></div>`).join('')}</div><div class="setting-detail"><div class="row between"><span class="small">当前运行模式</span>${chip('演示 / MOCK','green')}</div><p class="tiny muted mt8">三种路线只是候选，不预填效果、速度、价格或赢家。原始音频处理与文字处理可以分别批准。</p></div></section><div class="config-layout mt16"><section class="panel"><h3>数据生命周期</h3>${[['平板本地原件','期限待定'],['服务器原音频 / 转写','期限待定'],['纪要版本 / 导出 / 备份','期限待定'],['自动删除','关闭，未批准']].map(([a,b])=>`<div class="metric-row"><span class="muted">${a}</span>${chip(b,'amber')}</div>`).join('')}<p class="tiny muted mt16">“未定期限”不等于永久保存。正式上线前必须批准。</p></section><section class="panel"><h3>仍需你确认</h3><div class="config-row"><div><h4>最长会议时长和月总量</h4><p>2 小时只是开发长测样例，不是业务上限。</p></div></div><div class="config-row"><div><h4>AI 预算、数据范围与保密例外</h4><p>本地失败不会未经批准切换云端。</p></div></div><div class="config-row"><div><h4>备份位置、保留期限和恢复目标</h4><p>必须通过恢复测试，不只查看备份成功状态。</p></div></div></section></div>`}

function initialIAM(){return {session:null,tab:'users',version:1,search:'',deptFilter:'all',selection:'sales',draft:null,

 depts:[{id:'root',name:'示例公司',parent:'',owner:'',status:'active'},{id:'sales',name:'销售部',parent:'root',owner:'u2',status:'active'},{id:'finance',name:'财务部',parent:'root',owner:'',status:'active'},{id:'it',name:'信息技术部',parent:'root',owner:'u1',status:'active'}],

 probeUser:'u3',probeMeeting:'m1',probeAction:'view'};}

const iu=id=>I.users.find(x=>x.id===id), ir=id=>I.roles.find(x=>x.id===id), idept=id=>I.depts.find(x=>x.id===id);
const actor=()=>iu(I.session);
const persona=()=>actor()?.persona;
const iopt=(value,label,selected)=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(label)}</option>`;
const ifield=(label,id,value='',extra='')=>`<label class="field-label mt16" for="${id}">${label}</label><input class="input" id="${id}" value="${esc(value)}" ${extra}>`;
function iselect(label,id,options){return `<label class="field-label mt16" for="${id}">${label}</label><select class="input" id="${id}">${options}</select>`}
function iallow(tab){return persona()==='admin'?['users','org','roles','effective','audit'].includes(tab):persona()==='owner'?['groups','grants','roles','effective','audit'].includes(tab):['effective'].includes(tab)}
function ilog(action,detail){log(action,`${actor()?.name||'未登录'}（演示） · ${detail}`)}
function canDelegate(role,scope){return persona()==='owner' && ['sales','m1'].includes(scope) && role && !role.protected && role.perms.every(p=>['view','play','edit','review'].includes(p))}
function grantsFor(uid){return I.grants.filter(g=>g.active&&(g.subject==='user:'+uid||(g.subject.startsWith('group:')&&I.groups.find(x=>'group:'+x.id===g.subject)?.members.includes(uid))))}
function iprobe(uid,mid,action){const u=iu(uid),m=I.meetings.find(x=>x.id===mid);if(!u||u.status!=='active')return {ok:false,why:'账号已停用：所有授权均不可使用'};const sources=grantsFor(uid).filter(g=>{const role=ir(g.role);const match=g.scope===mid||(!m.restricted&&(g.scope==='all'||g.scope===m.dept));return role?.perms.includes(action)&&match&&(!m.past||g.history!=='future')});return sources.length?{ok:true,why:sources.map(g=>`${ir(g.role).name} / ${IAM_SCOPES[g.scope]} / ${g.id}`).join('；')}:{ok:false,why:m.restricted?'受限会议需要显式授权；普通部门范围不继承':'没有同时满足操作、会议范围与历史边界的授权'};}
function iamLogin(){return `<div class="iam-login"><div class="iam-login-copy"><span class="kicker">会议记录工作台</span><h1>用自己的身份，<br>进入授权的工作空间。</h1><p>查看会议、审核纪要和维护设备，<br>由不同的职责与访问范围管理。</p><div class="mt24 small muted">公用平板依然可以直接开始录音。<br>后台身份与录音设备身份分别管理。</div></div><section class="panel iam-login-form"><div class="row between"><h2>登录工作台</h2>${chip('身份演示','green')}</div><p class="small muted mt16">请选择虚构账号体验流程。不收集真实密码。</p>${iselect('演示账号','iam-login-user',I.users.map(u=>iopt(u.id,u.name+' · '+u.account+(u.status==='disabled'?'（已停用）':''),'u1')).join(''))}<div class="mt24">${button('模拟登录并继续','iam-login','primary w100','arrow')}</div><div class="divider"></div><p class="small muted">账号来源待确认：本地账号或公司统一身份。企业微信登录尚未接入。</p></section></div>`}
function iamWorkspace(){if(!iallow(I.tab))I.tab=persona()==='admin'?'users':persona()==='owner'?'grants':'effective';return `<div class="heading-row"><div><div class="kicker">公司管理 / 访问控制</div><h1>用户、组织与权限</h1><p>人员身份、操作职责与会议范围分别管理。</p></div>${chip('内存演示 · 刷新重置')}</div><nav class="tabbar iam-tabs">${Object.entries(IAM_TABS).filter(([k])=>iallow(k)).map(([k,v])=>`<button data-action="iam-tab-${k}" class="${I.tab===k?'active':''}">${v}</button>`).join('')}</nav>${I.tab==='users'?iamUsers():I.tab==='org'?iamOrg():I.tab==='roles'?iamRoles():I.tab==='groups'?iamGroups():I.tab==='grants'?iamGrants():I.tab==='effective'?iamEffective():audit()}`}
function iamUsers(){const users=I.users.filter(u=>(I.deptFilter==='all'||u.dept===I.deptFilter)&&(`${u.name} ${u.account}`.toLowerCase().includes(I.search.toLowerCase())));return `<div class="row between wrap mb16"><div class="row wrap"><input id="iam-search" class="input" style="width:230px" placeholder="搜索姓名或账号" aria-label="搜索姓名或账号" value="${esc(I.search)}"><select id="iam-filter" class="input" style="width:170px" aria-label="筛选部门">${iopt('all','全部部门',I.deptFilter)}${I.depts.filter(d=>d.id!=='root').map(d=>iopt(d.id,d.name,I.deptFilter)).join('')}</select><span id="iam-count">${chip(users.length+' 位用户')}</span></div>${button('新增用户','iam-new-user','primary','users')}</div><div class="table-shell"><table class="data-table"><thead><tr><th>姓名 / 账号</th><th>部门</th><th>角色与范围</th><th>状态</th><th>操作</th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><div class="small muted">${esc(u.account)}</div></td><td>${esc(idept(u.dept)?.name)}</td><td>${u.persona==='admin'?'账号管理 · 无正文权':u.persona==='owner'?'业务委派 · 销售范围':grantsFor(u.id).map(g=>esc(ir(g.role)?.name)+'<br><small class="muted">'+esc(IAM_SCOPES[g.scope])+'</small>').join('<br>')||'<span class="muted">尚未授权</span>'}</td><td>${chip(u.status==='active'?'正常':'已停用',u.status==='active'?'green':'red')}</td><td><div class="row wrap">${button('编辑','iam-edit-user-'+u.id,'sm')}${button('角色与范围','iam-assign-'+u.id,'sm')}${button(u.status==='active'?'停用':'启用','iam-toggle-user-'+u.id,'sm', '',u.id==='u1'?'disabled title="演示中的最后一位账号管理员受到保护"':'')}</div></td></tr>`).join('')||'<tr><td colspan="5">没有匹配用户，请调整搜索或部门筛选。</td></tr>'}</tbody></table></div><p class="small muted mt16">部门调动不会自动开放新部门历史会议。角色与会议范围由业务授权者成对授予。</p>`}
function iamOrg(){const d=idept(I.selection)||idept('sales');return `<div class="iam-split"><aside class="panel"><div class="row between mb16"><h3>部门结构</h3>${button('新增','iam-new-dept','sm')}</div>${I.depts.map(x=>`<button class="iam-tree ${d.id===x.id?'selected':''}" style="padding-left:${16+idepth(x.id)*16}px" data-action="iam-dept-${x.id}">${ico('users',15)} ${esc(x.name)} ${x.status==='disabled'?chip('停用'):''}</button>`).join('')}</aside><section class="panel"><div class="row between"><h2>${esc(d.name)}</h2>${d.id!=='root'?button('编辑部门','iam-edit-dept-'+d.id,'sm','edit'):chip('单公司根节点')}</div><div class="metric-row"><span>上级部门</span><span>${esc(idept(d.parent)?.name||'—')}</span></div><div class="metric-row"><span>负责人</span><span>${esc(iu(d.owner)?.name||'未设置')}</span></div><div class="metric-row"><span>状态</span>${chip(d.status==='active'?'启用':'停用')}</div><h3 class="mt24">部门成员</h3>${I.users.filter(u=>u.dept===d.id).map(u=>`<div class="metric-row"><span>${esc(u.name)}</span>${chip(u.status==='active'?'正常':'已停用')}</div>`).join('')||'<p class="small muted mt16">暂无成员</p>'}<div class="mt24">${banner('部门负责人不自动拥有会议正文权限；改名保留历史归属快照。','','info')}</div>${d.id!=='root'?`<div class="mt16">${button(d.status==='active'?'停用部门':'启用部门','iam-toggle-dept-'+d.id,'sm')}</div>`:''}</section></div>`}
function idepth(id,seen=new Set()){const d=idept(id);if(!d?.parent||seen.has(id))return 0;seen.add(id);return 1+idepth(d.parent,seen)}

function iamGroups(){return `<div class="row between mb16"><p class="small muted">跨部门组织人员，与企业微信群分开维护。</p>${button('新增访问组','iam-new-group','primary','users')}</div><div class="table-shell"><table class="data-table"><thead><tr><th>访问组</th><th>成员</th><th>关联授权与历史范围</th><th>操作</th></tr></thead><tbody>${I.groups.map(g=>`<tr><td><strong>${esc(g.name)}</strong></td><td>${g.members.map(id=>esc(iu(id)?.name)).join('、')||'暂无成员'}</td><td>${I.grants.filter(x=>x.active&&x.subject==='group:'+g.id).map(x=>esc(IAM_SCOPES[x.scope])+' · '+(x.history==='future'?'仅后续新会议':'包含明确历史样例')).join('<br>')||'未关联授权'}</td><td>${button('维护成员','iam-edit-group-'+g.id,'sm','users')}</td></tr>`).join('')}</tbody></table></div>`}
function iamGrants(){return `<div class="row between wrap mb16"><p class="small muted">当前业务委派范围：销售部普通会议；允许查看、回听、编辑与审核。</p>${button('新增会议授权','iam-new-grant','primary','shield')}</div><div class="table-shell"><table class="data-table"><thead><tr><th>授权对象</th><th>角色 / 会议范围</th><th>历史边界</th><th>状态</th><th>操作</th></tr></thead><tbody>${I.grants.map(g=>`<tr><td>${esc(isubject(g.subject))}</td><td>${esc(ir(g.role)?.name)}<div class="small muted">${esc(IAM_SCOPES[g.scope])}</div></td><td>${g.history==='future'?'仅授权后的新会议':'包含明确历史样例'}</td><td>${chip(g.active?'有效':'已撤销',g.active?'green':'')}</td><td>${button('撤销','iam-revoke-'+g.id,'sm','',g.active?'':'disabled')}</td></tr>`).join('')}</tbody></table></div><section class="panel mt24"><div class="row between"><h3>会议归属待确认</h3>${chip('待决 D-17','amber')}</div><p class="small muted mt8">同一平板可能供不同部门使用。未确认归属时，不按部门猜测接收群。</p><div class="metric-row"><span>匿名录音 · 会议室 A · 合成记录</span>${chip('仅指定责任人可确认')}</div><p class="small muted mt8">本页授权样例已有明确归属。录音认领方式将在共享会议室流程确认后补入，不把授权操作当作认领。</p></section>`}

function iamEffective(){if(persona()==='viewer')I.probeUser=I.session;const result=iprobe(I.probeUser,I.probeMeeting,I.probeAction);return `<section class="panel"><h2>检查某个人能否操作这场会议</h2><div class="iam-probe">${iselect('人员','iam-probe-user',I.users.filter(u=>persona()!=='viewer'||u.id===I.session).map(u=>iopt(u.id,u.name,I.probeUser)).join(''))}${iselect('合成会议','iam-probe-meeting',I.meetings.map(m=>iopt(m.id,m.name,I.probeMeeting)).join(''))}${iselect('操作','iam-probe-action',Object.entries(IAM_PERMS).map(([k,v])=>iopt(k,v,I.probeAction)).join(''))}</div><div class="iam-verdict ${result.ok?'allow':'deny'}"><h3>${result.ok?'允许操作':'拒绝操作'}</h3><p>${esc(result.why)}</p></div><p class="small muted mt16">这里展示虚构会议的权限计算。正式系统中的无权页面不展示标题。管理员身份本身不授予任何正文权限。</p></section>`}
function iopen(kind,id){I.draft=null;S.modal={type:'iam',kind,id,version:I.version};render()}
function iamModal(){const m=S.modal;let title='',body='',save='预览变更',action='iam-preview';const obj=m.kind==='user'?iu(m.id):m.kind==='dept'?idept(m.id):m.kind==='role'?ir(m.id):m.kind==='group'?I.groups.find(g=>g.id===m.id):null;
 if(I.draft){title='确认变更范围';const d=I.draft;body=`${banner('请核对本次操作的对象、变化与历史范围。这里只修改合成数据。','blue','shield')}<div class="iam-change mt16">${d.preview.map(([k,v])=>`<div class="metric-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div><p class="small muted mt16">原因：${esc(d.reason)}<br>提交后写入本次演示审计；取消不会生效。</p>`;save='确认变更';action='iam-commit';}
 else if(m.kind==='user'){title=obj?'编辑用户':'新增用户';body=ifield('姓名','iam-name',obj?.name,'maxlength="40"')+ifield('账号（唯一）','iam-account',obj?.account,'maxlength="64"'+(obj?' readonly':''))+iselect('主部门','iam-department',I.depts.filter(x=>x.id!=='root'&&x.status==='active').map(d=>iopt(d.id,d.name,obj?.dept||'sales')).join(''))+'<p class="small muted mt16">身份来源：本地演示。新增用户不自动获得内容权限；正式账号来源待确认。</p>';}

 else if(m.kind==='role'){title=obj?'配置角色权限':'新增业务角色';body=ifield('角色名称','iam-name',obj?.name,'maxlength="40"')+`<label class="field-label mt16">功能权限</label><div class="iam-checks">${Object.entries(IAM_PERMS).map(([k,v])=>`<label class="checkline"><input type="checkbox" name="iam-perm" value="${k}" ${obj?.perms.includes(k)?'checked':''}>${v}</label>`).join('')}</div><p class="small muted mt16">账号、组织和系统管理权属于保护角色，不能通过业务角色编辑授予。</p>`;}
 else if(m.kind==='group'){title=obj?'维护访问组成员':'新增业务访问组';body=ifield('访问组名称','iam-name',obj?.name,'maxlength="40"')+`<label class="field-label mt16">成员</label><div class="iam-checks">${I.users.filter(u=>u.status==='active').map(u=>`<label class="checkline"><input type="checkbox" name="iam-member" value="${u.id}" ${obj?.members.includes(u.id)?'checked':''}>${esc(u.name)} · ${esc(idept(u.dept)?.name)}</label>`).join('')}</div><p class="small muted mt16">新增成员可能继承本组既有历史授权；提交前会显示关联范围。移出只撤销本组带来的资格。</p>`;}
 else if(m.kind==='grant'){title='新增会议授权';body=iselect('授权对象','iam-subject',I.users.filter(u=>u.status==='active').map(u=>iopt('user:'+u.id,'人员 · '+u.name,m.id?'user:'+m.id:'user:u3')).join('')+I.groups.map(g=>iopt('group:'+g.id,'访问组 · '+g.name,'')).join(''))+iselect('角色','iam-role',I.roles.filter(r=>!r.protected).map(r=>iopt(r.id,r.name,'reader')).join(''))+iselect('会议范围','iam-scope',Object.entries(IAM_SCOPES).map(([k,v])=>iopt(k,v,'m1')).join(''))+iselect('历史资料边界（必选）','iam-history',iopt('','请选择，不默认开放历史','')+iopt('future','仅授权后的新会议','')+iopt('all','包含该范围内历史样例',''))+'<p class="small muted mt16">全公司和受限会议在本演示身份的委派范围之外，选择后将拒绝提交。</p>';}
 else{title=m.kind==='revoke'?'撤销会议授权':m.kind==='toggleUser'?'变更账号状态':'变更部门状态';body=banner(m.kind==='revoke'?'撤销该授权后，下次受控请求应重新判断；其他独立授权仍可能允许访问。':m.kind==='toggleUser'?'停用后拒绝新登录并撤销会话，保留原会议和历史操作。':'有成员、子部门或路由依赖的部门不能直接停用。','amber','alert');}

function ival(id){return document.getElementById(id)?.value.trim()||''}
function ipreview(){const m=S.modal,reason=ival('iam-reason');if(!reason)return toast('请填写变更原因');let data={},preview=[];
 if(m.kind==='user'){if(persona()!=='admin')return toast('当前身份不能管理账号');data={name:ival('iam-name'),account:ival('iam-account'),dept:ival('iam-department')};if(!data.name||!data.account)return toast('请填写姓名和账号');if(!/^[a-zA-Z0-9._@-]{3,64}$/.test(data.account))return toast('账号使用 3–64 位字母、数字或 . _ @ -');if(I.users.some(u=>u.id!==m.id&&u.account.toLowerCase()===data.account.toLowerCase()))return toast('账号已存在，请使用其他账号');preview=[['用户',data.name+' / '+data.account],['部门',`${idept(iu(m.id)?.dept)?.name||'未设置'} → ${idept(data.dept).name}`],['内容权限','本次不增加；已有授权需单独复核']];}
 if(m.kind==='dept'){if(persona()!=='admin')return toast('当前身份不能维护部门');data={name:ival('iam-name'),parent:ival('iam-parent'),owner:ival('iam-owner')};if(!data.name)return toast('请填写部门名称');let p=data.parent;while(p){if(p===m.id)return toast('不能将部门移到自身或下级部门');p=idept(p)?.parent}if(I.depts.some(d=>d.id!==m.id&&d.parent===data.parent&&d.name===data.name))return toast('同级部门名称已存在');preview=[['部门',data.name],['上级',idept(data.parent).name],['负责人',iu(data.owner)?.name||'未设置'],['历史记录','保留原归属快照；不自动开放内容']];}
 if(m.kind==='role'){if(!['admin','owner'].includes(persona()))return toast('无角色维护权限');const old=ir(m.id);if(old?.protected)return toast('系统保护角色不能普通编辑');data={name:ival('iam-name'),perms:[...document.querySelectorAll('[name="iam-perm"]:checked')].map(x=>x.value)};if(!data.name||!data.perms.length)return toast('请填写名称并至少选择一项功能');if(I.roles.some(r=>r.id!==m.id&&r.name===data.name))return toast('角色名称已存在');const linked=I.grants.filter(g=>g.active&&g.role===m.id);if(linked.some(g=>!canDelegate(data,g.scope)))return toast('该角色已有授权，当前身份无权改变其有效权限');preview=[['角色',data.name],['功能',data.perms.map(p=>IAM_PERMS[p]).join('、')],['受影响授权',linked.length+' 条'],['数据范围','本次不新增或扩大范围']];}
 if(m.kind==='group'){if(persona()!=='owner')return toast('需要业务委派权限');data={name:ival('iam-name'),members:[...document.querySelectorAll('[name="iam-member"]:checked')].map(x=>x.value)};if(!data.name)return toast('请填写访问组名称');if(I.groups.some(g=>g.id!==m.id&&g.name===data.name))return toast('访问组名称已存在');const linked=I.grants.filter(g=>g.active&&g.subject==='group:'+m.id);if(linked.some(g=>!canDelegate(ir(g.role),g.scope)))return toast('关联范围超出本人的委派资格，不能修改成员');preview=[['访问组',data.name],['变更前',I.groups.find(g=>g.id===m.id)?.members.map(x=>iu(x)?.name).join('、')||'无成员'],['变更后',data.members.map(x=>iu(x)?.name).join('、')||'无成员'],['继承范围',linked.map(g=>IAM_SCOPES[g.scope]+(g.history==='all'?'（包含历史）':'（仅新会议）')).join('；')||'尚未授权']];}
 if(m.kind==='grant'){data={subject:ival('iam-subject'),role:ival('iam-role'),scope:ival('iam-scope'),history:ival('iam-history'),active:true,reason};if(!data.history)return toast('请选择历史资料边界');if(!canDelegate(ir(data.role),data.scope))return toast('超出当前身份可委派的功能或会议范围');if(I.grants.some(g=>g.active&&g.subject===data.subject&&g.role===data.role&&g.scope===data.scope&&g.history===data.history))return toast('相同授权已存在');preview=[['授权对象',isubject(data.subject)],['角色',ir(data.role).name],['会议范围',IAM_SCOPES[data.scope]],['历史边界',data.history==='future'?'仅授权后的新会议':'包含该范围内历史样例'],['接收群','不改变、不发送']];}
 if(m.kind==='revoke'){const g=I.grants.find(g=>g.id===m.id);if(!g?.active||!canDelegate(ir(g.role),g.scope))return toast('无权撤销或授权已失效');preview=[['对象',isubject(g.subject)],['撤销角色',ir(g.role).name],['撤销范围',IAM_SCOPES[g.scope]],['其他独立授权','保留并重新计算有效权限']];}
 if(m.kind==='toggleUser'){const u=iu(m.id);if(persona()!=='admin'||u.id==='u1')return toast('无权操作或最后一位管理员受保护');data.status=u.status==='active'?'disabled':'active';preview=[['用户',u.name],['状态',data.status==='disabled'?'正常 → 停用':'停用 → 正常'],['受控会话',data.status==='disabled'?'撤销所有现有会话':'需要重新登录；现有授权将重新按规则判断'],['历史会议','保留原件与操作人']];}
 if(m.kind==='toggleDept'){const d=idept(m.id);if(persona()!=='admin'||d.id==='root')return toast('无权操作根部门');if(d.status==='active'&&(I.users.some(u=>u.dept===d.id)||I.depts.some(x=>x.parent===d.id)||['sales','finance'].includes(d.id)))return toast('存在成员、子部门或会议/路由依赖，请先处理交接');data.status=d.status==='active'?'disabled':'active';preview=[['部门',d.name],['新状态',data.status==='active'?'启用':'停用'],['依赖检查','演示成员、子部门与固定路由检查通过']];}
 I.draft={kind:m.kind,id:m.id,data,preview,reason,version:m.version,actor:I.session};render();}
function icommit(){const d=I.draft;if(!d||!actor()||actor().status!=='active')return toast('请重新登录');if(d.version!==I.version||d.actor!==I.session)return toast('配置或身份已变化，请取消后重新预览');const data=d.data,id=d.id;
 if(d.kind==='user'){if(id)Object.assign(iu(id),data);else I.users.push({...data,id:'u'+Date.now(),status:'active',persona:'viewer'});}
 if(d.kind==='dept'){if(id)Object.assign(idept(id),data);else I.depts.push({...data,id:'d'+Date.now(),status:'active'});}
 if(d.kind==='role'){if(id)Object.assign(ir(id),data);else I.roles.push({...data,id:'r'+Date.now(),protected:false});}
 if(d.kind==='group'){if(id)Object.assign(I.groups.find(g=>g.id===id),data);else I.groups.push({...data,id:'g'+Date.now()});}
 if(d.kind==='grant')I.grants.push({...data,id:'a'+Date.now()});
 if(d.kind==='revoke')I.grants.find(g=>g.id===id).active=false;
 if(d.kind==='toggleUser')iu(id).status=data.status;
 if(d.kind==='toggleDept')idept(id).status=data.status;
 ilog('权限管理变更',d.preview.map(([k,v])=>k+'：'+v).join('；')+'；原因：'+d.reason);I.version++;I.draft=null;S.modal=null;render();toast('已保存演示变更；未修改任何真实账号或权限');}
function iamAct(a){if(a==='iam-login'){const u=iu(ival('iam-login-user'));if(!u||u.status!=='active')return toast('账号已停用，无法登录');I.session=u.id;S.role=u.persona==='admin'?'admin':u.persona==='owner'?'reviewer':'viewer';S.view='access';I.tab=u.persona==='admin'?'users':u.persona==='owner'?'grants':'effective';ilog('模拟登录',u.account);render();return}if(a==='iam-logout'){ilog('退出登录','清除演示会话');I.session=null;I.draft=null;S.modal=null;render();return}if(a==='iam-expire'){I.session=null;S.modal=null;render();toast('会话已过期，请重新登录');return}
 if(!actor()||actor().status!=='active'){I.session=null;render();return}
 if(a.startsWith('iam-tab-')){const tab=a.slice(8);if(!iallow(tab))return toast('当前身份无权访问该管理页');I.tab=tab;render();return}
 if(a==='iam-preview')return ipreview();if(a==='iam-commit')return icommit();
 if(a.startsWith('iam-dept-')){I.selection=a.slice(9);render();return}
 if(a.startsWith('iam-assign-')){return toast('账号管理员不能授予正文权限；请切换为业务授权者，在“会议授权”分配角色与范围');}
 const actions=[['iam-new-user','user'],['iam-edit-user-','user'],['iam-toggle-user-','toggleUser'],['iam-new-dept','dept'],['iam-edit-dept-','dept'],['iam-toggle-dept-','toggleDept'],['iam-new-role','role'],['iam-edit-role-','role'],['iam-new-group','group'],['iam-edit-group-','group'],['iam-new-grant','grant'],['iam-revoke-','revoke']];
 for(const [prefix,kind] of actions)if(a===prefix||prefix.endsWith('-')&&a.startsWith(prefix)){iopen(kind,a.slice(prefix.length)||undefined);return}
}
function iamBind(){for(const [id,key] of [['iam-probe-user','probeUser'],['iam-probe-meeting','probeMeeting'],['iam-probe-action','probeAction'],['iam-filter','deptFilter']])document.getElementById(id)?.addEventListener('change',e=>{I[key]=e.target.value;render()});document.getElementById('iam-search')?.addEventListener('input',e=>{I.search=e.target.value;const tmp=document.createElement('template');tmp.innerHTML=iamUsers();const table=document.querySelector('.workspace-main .table-shell');table.innerHTML=tmp.content.querySelector('.table-shell').innerHTML;document.getElementById('iam-count').innerHTML=tmp.content.querySelector('#iam-count').innerHTML;table.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action,el)))});}

const initialHash=location.hash.replace('#','');if(initialHash==='users'){S.mode='console';S.view='access'}else if(initialHash==='console'){S.mode='console'}else if(initialHash==='detail'){S.mode='console';S.view='detail'}else if(initialHash==='mobile'){S.mode='mobile'}else if(initialHash==='rules'){S.mode='console';S.view='rules'}
render();
</script></body></html>
