plugins { id 'com.android.application' }
android {
    namespace 'cn.jiajian.yanxu'
    compileSdk 35
    defaultConfig { testInstrumentationRunner (project.findProperty('yanxuTestRunner') ?: 'cn.jiajian.yanxu.UpdateInstrumentation'); applicationId 'cn.jiajian.yanxu'; minSdk 26; targetSdk 35; versionCode = (project.findProperty('yanxuVersionCode') ?: '15').toInteger(); versionName = (project.findProperty('yanxuVersionName') ?: '0.3.5') }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
