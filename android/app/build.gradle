plugins { id 'com.android.application' }
android {
    namespace 'cn.jiajian.yanxu'
    compileSdk 35
    defaultConfig { testInstrumentationRunner 'cn.jiajian.yanxu.UpdateInstrumentation'; applicationId 'cn.jiajian.yanxu'; minSdk 26; targetSdk 35; versionCode = (project.findProperty('yanxuVersionCode') ?: '8').toInteger(); versionName = (project.findProperty('yanxuVersionName') ?: '0.1.7') }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
