</style></head><body><div id="app"></div><noscript>原型需要JavaScript；不采音、不联网、不发真实消息。</noscript><script>'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',disabled=false)=>`<button class="btn ${kind}" data-act="${action}" ${disabled?'disabled':''}>${label}</button>`;
const badge=(s,c='')=>`<span class="chip ${c}">${esc(s)}</span>`;
const notice=(s,c='')=>`<div class="banner ${c}">${esc(s)}</div>`;
const options=(arr,selected)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('');
const stamp=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
const defaultTasks=()=>[{text:'修正并提交报价表',owner:'王工',due:'2026-09-24',source:'seg-004'},{text:'核对客户资料',owner:'',due:'',source:'seg-007'}];
const summary='确认客户报价为 125,000 元，不批准额外采购。P-208 的交付日期仍待客户确认；报价修订、资料核对与进展反馈列为行动事项。';
const initial=()=>({mode:'tablet',scenario:'normal',online:true,phase:'scan',employee:null,dept:'sales',seconds:0,challenge:1,expired:false,consumed:false,phone:null,selected:'m1',ptab:'summary',filter:'all',admin:false,adminTab:'overview',modal:null,error:'',pause:false,aiEnabled:true,notes:[],users:[{id:'lin',name:'林同事',dept:'sales',allowedDepts:['sales','finance'],active:true,registered:true,internal:true},{id:'chen',name:'陈同事',dept:'finance',active:true,registered:true,internal:true},{id:'zhou',name:'周同事',dept:'sales',active:true,registered:false,internal:true},{id:'left',name:'停用员工',dept:'sales',active:false,registered:true,internal:true},{id:'outside',name:'其他企业用户',dept:'sales',active:true,registered:false,internal:false}],depts:[{id:'sales',name:'销售部',active:true},{id:'finance',name:'财务部',active:true}],groups:[{id:'project',name:'销售协作组',members:['zhou']}],roles:[{id:'employee',name:'基础员工',protected:true,perms:['本人会议','接受只读授权']},{id:'viewer',name:'会议查看者',protected:false,perms:['纪要/逐字稿/事项','在线回听']},{id:'admin',name:'平台管理员',protected:true,perms:['账号组织','设备路由','异常处理']}],routes:{sales:'销售管理群（虚构）',finance:'财务管理群（虚构）'},audit:[],records:[{id:'m1',title:'报价与交付协调 · 合成样例',owner:'lin',dept:'sales',duration:99,progress:4,state:'ACCEPTED',summary,version:1,versions:[{v:1,text:summary}],snapshot:{v:1,text:summary,target:'销售管理群（虚构）'},sent:true,attempts:0,grants:[],events:['AI 资料已生成','渠道已接收（演示）']},{id:'m2',title:'财务例会 · 合成样例',owner:'chen',dept:'finance',duration:120,progress:4,state:'ACCEPTED',summary:'财务部门合成资料，仅用于权限隔离演示。',version:1,versions:[],snapshot:{v:1,text:'财务部门合成资料',target:'财务管理群（虚构）'},sent:true,attempts:0,grants:[],events:[]}]});
let saveEpoch=0;let S=initial();try{S.notes=JSON.parse(localStorage.getItem('yanxu03-notes')||'[]')}catch{}
const user=id=>S.users.find(u=>u.id===id), deptName=id=>S.depts.find(d=>d.id===id)?.name||'未配置';
const canRead=(m,id)=>!!m&&!!user(id)?.active&&user(id).internal&&(m.owner===id||m.grants.some(g=>g.active&&(g.subject===id||g.subject==='group:project'&&S.groups[0].members.includes(id))));
const canEdit=m=>canRead(m,S.phone)&&m.owner===S.phone;
const fmt=n=>`${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n%3600/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const stateText=m=>m.manualResolution?'人工记录已核对接收（模拟）':({QUEUED:'等待上传',WAITING_NETWORK:'等待网络',ARCHIVED:'原音频已归档',TRANSCRIBED:'逐字稿已生成',READY:'AI 资料已生成',ACCEPTED:'渠道已接收（演示）',UNCONFIGURED:'缺少接收群配置',AI_RETRY:'AI 正在自动重试',AI_FAILED:'AI 失败，管理员已获告警',UNKNOWN:'发送结果不明，管理员需处理',PAUSED:'管理员已停发',BLOCKED_AI:'AI 服务未配置',OWNER_DISABLED:'发起人已停用，等待管理员检查'}[m.state]||m.state);
function log(action,detail){S.audit.unshift({time:stamp(),action,detail})}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3800)}
function pageId(){if(S.modal?.kind==='edit')return 'MOB-03';if(S.modal?.kind==='share')return 'MOB-04';if(S.mode==='tablet')return S.phase==='scan'?'PAD-00':S.phase==='ready'?'PAD-01':['recording','paused'].includes(S.phase)?'PAD-02':'PAD-03';if(S.mode==='phone')return !S.phone?'AUTH-01':S.selected?'MOB-02':'MOB-01';return ({overview:'ADM-00',users:'IAM-01',org:'IAM-02',roles:'IAM-03',groups:'IAM-04',routes:'DIST-01',exceptions:'ADM-04',audit:'IAM-07',devices:'ADM-01'}[S.adminTab]||'ADM-00')}
function app(){return `<header class="studio"><div class="brand"><div class="brand-mark">◖</div><div><div class="brand-title">言序 / 自动会议记录</div><small>全自动流程原型 · v0.3 · 合成资料</small></div></div><nav class="mode-tabs">${[['tablet','平板录音端'],['phone','员工手机端'],['admin','管理后台']].map(([k,t])=>`<button data-act="mode:${k}" class="${S.mode===k?'active':''}">${t}</button>`).join('')}</nav><div class="studio-actions">${btn('评审意见','notes','sm')}</div></header><div class="toolbar"><div class="row wrap"><span class="caption">评审工具</span><select id="scenario" aria-label="故障演示场景">${options([['normal','正常全自动'],['offline','断网待传'],['save_fail','本地保存失败'],['ai_fail','AI 重试耗尽'],['no_route','缺少群配置'],['unknown','发送结果不明']],S.scenario)}</select>${btn(S.online?'模拟断网':'恢复网络','network','sm')}${btn('重置演示','reset','ghost sm')}</div><span class="small muted">不采音 · 不联网 · 不登录企业微信 · 不发真实消息</span></div><main>${S.mode==='tablet'?tablet():S.mode==='phone'?phone():admin()}</main><footer class="review-foot">${pageId()} · 已确认业务基线 U-11 / PRD v1.3。身份、录音、AI 与发送均为模拟；实际权限必须由服务器校验。</footer>${S.modal?modal():''}`}
function tablet(){const employee=user(S.employee);return `<div class="tablet-stage"><div class="tablet-label"><span>会议室 A · 共享设备</span>${badge(S.online?'网络在线':'网络离线',S.online?'green':'amber')}</div><section class="tablet-frame"><div class="tablet"><div class="tablet-top"><div class="tablet-brand">会议室 A</div><span class="small muted">设备已绑定（演示） · 不设业务时长上限</span></div>${S.phase==='scan'?`<div class="pad-content"><div><div class="kicker">每场扫码，记录属于发起人</div><h1>扫码开始这场会议</h1><p class="muted mt16">使用企业微信员工身份。<br>结束并保存后自动退出，后续处理交给系统。</p><div class="qr-demo ${S.expired?'expired':''}" aria-label="不可实际扫描的二维码示意">${S.expired?'已过期':'扫码示意'}</div><p class="small muted">模拟二维码 · 不可实际扫码</p><div class="row mt16 wrap">${btn('模拟手机扫码','scan','primary',!S.online||S.expired)}${btn('刷新二维码','refresh-code','')}${btn('模拟过期','expire','ghost sm')}</div>${!S.online?notice('新场扫码需要联网；已保存的队列仍然保留。','amber'):''}</div><aside class="guide-card"><h3>员工只需三步</h3><div class="guide-step">① 手机扫码登录本场</div><div class="guide-step">② 开始录音</div><div class="guide-step">③ 结束后离开</div><p class="small muted mt24">系统自动上传、转写、总结和发群。手机可查阅本人和授权资料。</p><div class="mt24">${queue()}</div></aside></div>`:S.phase==='ready'?`<div class="pad-content"><div><div class="kicker">本场发起人</div><h1>${esc(employee?.name)}</h1><label class="field-label mt24" for="capture-dept">会议归属</label><select id="capture-dept" class="input">${options((employee.allowedDepts||[employee.dept]).filter(id=>S.depts.find(d=>d.id===id)?.active).map(id=>[id,deptName(id)]),S.dept)}</select><p class="small muted mt8">默认本人部门；仅可选择获授权的范围。调整归属不会开放该部门全部会议。</p><div class="mt24">${btn('开始录音','start','primary large')}</div><div class="mt16">${btn('退出本场','exit-session','ghost')}</div></div><aside class="guide-card"><h3>结束后自动完成</h3><p class="mt16">原录音 → 逐字稿 → AI 纪要与事项 → 群摘要</p><p class="small muted mt16">接收群：${esc(S.routes[S.dept]||'尚未配置')}<br>发起人不能在这里任意换群。</p>${queue()}</aside></div>`:['recording','paused'].includes(S.phase)?`<div class="record-area"><div class="record-title ${S.phase==='paused'?'paused':''}">● ${S.phase==='paused'?'已暂停':'正在录音（模拟）'}</div><div class="timer mono" id="timer">${fmt(S.seconds)}</div><p class="muted">发起人：${esc(employee?.name)} · ${esc(deptName(S.dept))}</p><div class="sim-wave" aria-label="模拟输入活动"></div><p class="small muted">示意波形，不采集麦克风；时长不会触发自动截止</p><div class="record-controls">${btn(S.phase==='paused'?'继续录音':'暂停录音',S.phase==='paused'?'resume':'pause','large')}${btn('结束并保存','end','primary large')}</div><div class="mt24">${!S.online?notice('已断网，本场继续保存；结束后等待补传。','amber'):notice('结束后自动退出员工身份，设备继续上传和整理。')}</div></div>`:S.phase==='saving'?`<div class="saved-main"><h1>正在保护本地录音</h1><p>尚未确认保存成功，请稍候。</p></div>`:S.phase==='save-error'?`<div class="saved-main"><h1>本地保存失败</h1><p>已录片段正在保护，尚未确认保存成功。</p>${notice('当前发起人仍绑定本场；不会把文件归给下一位员工。','amber')}<div class="row mt24">${btn('模拟修复并重试保存','retry-save','primary')}</div></div>`:`<div class="saved-main"><div class="saved-icon">✓</div><h1>已保存，你可以离开了</h1><p>员工身份已自动退出。设备会继续上传、整理并发群。</p><div class="mt24">${queue()}</div><div class="row mt24 wrap">${btn('下一场扫码','next','primary')}</div></div>`}<div class="tablet-bottom"><span>长期保留公司档案 · 平板不展示历史正文</span><span>本机队列 ${S.records.filter(m=>m.progress<1).length}</span></div></div></section></div>`}
function queue(){const jobs=S.records.filter(m=>m.id.startsWith('rec'));return `<div class="queue-box"><h4>设备处理队列</h4>${jobs.length?jobs.slice(-3).map(m=>`<div class="metric-row"><span class="small">${esc(m.id)} · ${fmt(m.duration)}</span>${badge(stateText(m),m.progress===4?'green':'amber')}</div>`).join(''):'<p class="small muted mt8">当前没有待传记录</p>'}</div>`}
function phone(){if(S.phone&&!user(S.phone)?.active)S.phone=null;return `<div class="mobile-work"><div class="phone-shell"><div class="phone-title"><strong>言序 · 我的会议</strong>${S.phone?btn('退出','phone-out','sm'):badge('企业微信身份')}</div>${!S.phone?`<div class="phone-login"><h2>查看你的会议资料</h2><p>公司内外均使用企业微信身份登录。<br>首次有效员工自动开通基础账号。</p><label class="field-label" for="phone-user">选择演示员工</label><select class="input" id="phone-user">${options(S.users.map(u=>[u.id,u.name+(u.registered?'':' · 首次登录')]),'lin')}</select><div class="mt24">${btn('模拟企业微信登录','phone-in','primary')}</div><p class="small muted">不连接企业微信；不收集账号密码。</p></div>`:S.selected?phoneDetail():phoneList()}</div><aside class="mobile-side"><div class="kicker">结束以后，不用再做什么</div><h1>资料自动整理，<br>需要时随时查看。</h1><p class="muted mt16">原录音、逐字稿、纪要和事项完成哪项，就可以查阅哪项。</p><p class="small muted mt24">员工仅看本人发起及明确授权的会议；同部门不自动获得资格。更正与共享都是可选操作，不阻断自动发群。</p><div class="mt24">${btn('演示无权访问','deny-demo','')}${btn('查看群消息样例','message-demo','mt16')}</div><p class="small muted mt24">合成样例未附真实音频，回听入口只展示权限和状态，不假装播放录音。</p></aside></div>`}
function phoneList(){let records=S.records.filter(m=>canRead(m,S.phone)).filter(m=>S.filter==='all'||S.filter==='mine'&&m.owner===S.phone||S.filter==='shared'&&m.owner!==S.phone);return `<div class="phone-content"><div class="row between"><h2>${esc(user(S.phone).name)}</h2>${badge('基础员工','green')}</div><div class="tabbar">${[['all','全部'],['mine','我发起的'],['shared','分享给我']].map(([k,t])=>`<button data-act="filter:${k}" class="${S.filter===k?'active':''}">${t}</button>`).join('')}</div>${records.map(m=>`<button class="meeting-card" data-act="open:${m.id}"><div class="row between"><strong>${esc(m.title)}</strong><span>›</span></div><p class="small muted mt8">${esc(deptName(m.dept))} · ${fmt(m.duration)} · ${m.owner===S.phone?'我发起':'只读共享'}</p><div class="mt8">${badge(stateText(m),m.sent?'green':'amber')}</div></button>`).join('')||`<div class="empty-card"><h3>暂无可查看会议</h3><p class="small muted mt8">你发起或明确授权的会议会出现在这里。</p></div>`}</div>`}
function phoneDetail(){const m=S.records.find(m=>m.id===S.selected);if(!canRead(m,S.phone))return `<div class="phone-content">${btn('返回我的会议','phone-list','sm')}<div class="empty-card"><h2>无法访问这份记录</h2><p class="small muted mt16">记录不可用或你没有查看权限。请联系发起人或管理员。</p></div></div>`;
m.tasks??=defaultTasks();let body='';if(S.ptab==='summary')body=m.progress>=3?`<h3>会议纪要</h3><p class="meeting-text">${esc(m.summary)}</p>${notice('AI 生成内容可能存在错误；未知事项如实标注，不要求人工核对后才发送。')}<div class="mt16">${badge('当前 v'+m.version)} ${badge(m.sent?'群消息 v'+m.snapshot.v:'等待自动发送')}</div>${canEdit(m)?`<div class="row wrap mt24">${btn('主动更正','edit','')}${btn('共享查看权','share','')}</div>`:''}`:notice('纪要尚未生成；已完成的原录音或逐字稿可先查看。','blue');
if(S.ptab==='transcript')body=m.progress>=2?`<h3>逐字稿</h3><p class="small muted mt8">AI 转写合成样例 · 未进行真实语音识别</p>${['00:10 李工：客户报价是十二万五千元，不是十五万元。','00:30 主持人：报价仍按十二万五千元，不批准额外采购。','01:00 发言人：客户资料需要再核对，负责人和时间还没有定。'].map(t=>`<div class="decision"><p>${esc(t)}</p></div>`).join('')}`:notice('等待转写；原件归档状态独立保留。','blue');
if(S.ptab==='tasks')body=m.progress>=3?`<h3>行动事项</h3>${m.tasks.map(t=>`<div class="decision"><div><strong>${esc(t.text)}</strong><p>${esc(t.owner||'负责人未明确')} · ${esc(t.due||'期限未明确')}</p><span class="small muted">原文依据 ${esc(t.source)} · 仅内容整理，不是派单</span></div></div>`).join('')}${badge('未知字段不阻断自动发送','amber')}${canEdit(m)?`<div class="mt16">${btn('主动更正事项','edit','')}</div>`:''}`:notice('事项正在自动整理。','blue');
if(S.ptab==='audio')body=m.progress>=1?`<h3>原始录音</h3><p class="mt16">${fmt(m.duration)} · 原件已归档（模拟）</p><div class="empty-card mt16"><h4>样例未附真实音频</h4><p class="small muted mt8">正式系统允许有权员工在线回听。本原型没有采音或实际播放。</p></div><div class="row wrap mt16">${btn('播放 · 无样例音频','noop','',true)}${btn('下载 · 未单独授权','noop','',true)}</div>`:notice('等待设备上传；不能把本地保存当作服务器归档。','amber');
if(S.ptab==='versions')body=`<h3>内容与发送版本</h3>${m.versions.map(v=>`<div class="decision"><div><strong>v${v.v} ${v.v===1?'AI 原稿':'主动更正版'}</strong><p>${esc(v.text)}</p></div></div>`).join('')}${m.sent?notice('群里已发送的 v'+m.snapshot.v+' 快照保留；保存更正不会重发。'):''}`;
return `<div class="phone-content">${btn('返回我的会议','phone-list','ghost sm')}<h2 class="mt16">${esc(m.title)}</h2><p class="small muted mt8">${esc(user(m.owner)?.name)} · ${esc(deptName(m.dept))} · ${fmt(m.duration)}</p><div class="mt16">${badge(stateText(m),m.sent?'green':'amber')}</div><nav class="tabbar mt16">${[['summary','纪要'],['transcript','逐字稿'],['tasks','事项'],['audio','录音'],['versions','版本']].map(([k,t])=>`<button data-act="ptab:${k}" class="${S.ptab===k?'active':''}">${t}</button>`).join('')}</nav>${body}${m.progress<4?'<p class="small muted mt24">处理与发送由系统继续推进；无法恢复的异常由管理员处理。</p>':''}</div>`}
const navs=[['overview','自动处理概览'],['users','用户与组织身份'],['org','组织部门'],['roles','角色权限'],['groups','业务访问组'],['routes','部门与接收群'],['exceptions','异常处理'],['audit','操作记录'],['devices','设备与存储']];
function admin(){if(!S.admin)return `<div class="admin-entry panel"><h1>管理工作台</h1><p class="muted mt16">管理员维护身份、设备、接收群和自动处理异常。管理身份不自动获得会议正文权限。</p><div class="mt24">${btn('进入演示管理员','admin-in','primary')}</div><p class="small muted mt16">模拟身份；真实系统需要企业微信身份及显式管理资格。</p></div>`;return `<div class="console"><aside class="sidebar"><div class="workspace-name"><strong>言序工作台</strong></div>${navs.map(([k,v])=>`<button class="side-link ${S.adminTab===k?'active':''}" data-act="admin-tab:${k}">${v}</button>`).join('')}<div class="sidebar-bottom">${btn('退出管理员','admin-out','sm')}<p class="tiny muted mt16">没有普通会议待审队列<br>全部数据为演示</p></div></aside><section class="workspace-main"><div class="heading-row"><div><div class="kicker">管理与运维</div><h1>${navs.find(n=>n[0]===S.adminTab)[1]}</h1></div>${badge('全程合成数据')}</div>${adminBody()}</section></div>`}

if(z.kind==='group'){title='访问组成员';body=notice('更改成员可能改变已共享会议的查看资格。部门归属不因此改变。','amber')+S.users.filter(u=>u.internal&&u.active).map(u=>`<label class="checkline"><input type="checkbox" name="group-member" value="${u.id}" ${S.groups[0].members.includes(u.id)?'checked':''}>${esc(u.name)}</label>`).join('');foot=btn('确认成员变更','save-group','primary')}

if(z.kind==='notes'){title='记录评审意见';body=`<p class="small muted">当前页：${pageId()}。只保存到本浏览器，不发送。</p><textarea id="note-text" class="input mt16" rows="4" placeholder="写下需要调整的地方"></textarea><div class="mt16">${S.notes.map(n=>`<p class="small">${esc(n.page)} · ${esc(n.text)}</p>`).join('')}</div>`;foot=btn('保存意见','save-note','primary')+btn('导出意见','export-notes','')}

function show(kind,id){S.modal={kind,id,base:S.records.find(m=>m.id===S.selected)?.version,challenge:S.challenge};S.error='';render()}
function fail(message){S.error=message;const old=document.querySelector('[role=alert]');if(old)old.textContent=message;else{const e=document.createElement('p');e.className='error-text';e.role='alert';e.textContent=message;document.querySelector('.dialog-body')?.append(e)}toast(message)}
function acceptIdentity(id){const u=user(id);if(!u||!u.active||!u.internal)return false;if(!u.registered){u.registered=true;log('首次企业身份自动开户',u.name+' · 基础员工，无管理资格')}return true}
function finishSave(){if(S.scenario==='save_fail'){S.phase='save-error';render();return}const owner=S.employee;const id='rec-'+(S.records.filter(m=>m.id.startsWith('rec')).length+1).toString().padStart(3,'0');const m={id,title:'新会议 · 自动整理样例',owner,dept:S.dept,duration:S.seconds,progress:0,state:S.online?'QUEUED':'WAITING_NETWORK',summary,version:1,versions:[],snapshot:null,sent:false,attempts:0,grants:[],events:[],scenario:S.scenario,target:S.scenario==='no_route'?'':S.routes[S.dept],sendCount:0};S.records.push(m);S.last=id;S.employee=null;S.phase='saved';log('本地保存后自动退出',id+' · 发起人已冻结，设备任务继续');render()}
function advance(m){if(m.sent||['UNKNOWN','AI_FAILED','UNCONFIGURED','OWNER_DISABLED'].includes(m.state))return;if(!S.online&&m.progress===0){m.state='WAITING_NETWORK';return}if(m.progress===0){m.progress=1;m.state='ARCHIVED';log('原件归档',m.id);return}if(!S.aiEnabled){m.state='BLOCKED_AI';return}if(m.progress<3&&m.scenario==='ai_fail'){m.attempts++;m.state=m.attempts>=2?'AI_FAILED':'AI_RETRY';if(m.state==='AI_FAILED')log('管理员告警',m.id+' · AI重试耗尽；员工无维护任务');return}if(m.progress===1){m.progress=2;m.state='TRANSCRIBED';return}if(m.progress===2){m.progress=3;m.state='READY';m.versions.push({v:1,text:summary});m.tasks??=defaultTasks();m.snapshot={v:m.version,text:m.summary,target:m.target,tasks:m.tasks.map(t=>({...t}))};return}if(S.pause){m.state='PAUSED';return}if(!user(m.owner)?.active){m.state='OWNER_DISABLED';return}if(!m.target){m.state='UNCONFIGURED';log('管理员告警',m.id+' · 缺少接收群');return}if(m.scenario==='unknown'){m.state='UNKNOWN';log('管理员告警',m.id+' · 结果不明，不自动重发');return}m.progress=4;m.state='ACCEPTED';m.sent=true;m.sendCount++;log('自动发送（模拟）',m.id+' · '+m.target+' · v'+m.snapshot.v)}
function act(a){if(a==='noop')return;if(a.startsWith('mode:')){S.mode=a.split(':')[1];S.modal=null;render();return}if(a==='reset'){saveEpoch++;const notes=S.notes;S=initial();S.notes=notes;render();return}if(a==='network'){S.online=!S.online;render();return}if(a==='expire'){S.expired=true;render();return}if(a==='refresh-code'){if(S.employee)return;S.challenge++;S.expired=false;S.consumed=false;render();return}if(a==='scan'){if(!S.online||S.expired)return toast('请联网并刷新扫码挑战');return show('scan')}
if(a==='scan-confirm'){const id=document.querySelector('#scan-user').value;if(!S.online||S.expired||S.consumed||S.modal.challenge!==S.challenge)return fail('二维码已失效，请重新扫码');if(!acceptIdentity(id))return fail('账号不可用或不属于本企业');S.employee=id;S.dept=user(id).dept;S.consumed=true;S.phase='ready';S.modal=null;log('本场扫码登录',user(id).name);render();return}

if(a==='phone-in'){const id=document.querySelector('#phone-user').value;if(!acceptIdentity(id))return toast('账号不可用或不属于本企业');S.phone=id;S.selected=null;log('手机模拟企业微信登录',user(id).name);render();return}if(a==='phone-out'){S.phone=null;S.selected=null;S.modal=null;render();return}if(a==='phone-list'){S.selected=null;render();return}if(a.startsWith('filter:')){S.filter=a.split(':')[1];render();return}if(a.startsWith('open:')){S.selected=a.slice(5);S.ptab='summary';render();return}if(a.startsWith('ptab:')){S.ptab=a.slice(5);render();return}if(a==='deny-demo'){S.selected='unavailable';render();return}
if(a==='edit'||a==='share'){const m=S.records.find(x=>x.id===S.selected);if(!canEdit(m)||m.progress<3)return toast('没有操作资格或资料尚未生成');return show(a)}if(a==='save-edit'){const m=S.records.find(x=>x.id===S.selected);if(!canEdit(m))return fail('没有更正权限');const text=document.querySelector('#edit-text').value.trim(),reason=document.querySelector('#edit-reason').value.trim();if(!text||!reason)return fail('请填写纪要和更正原因');if(m.version!==S.modal.base)return fail('版本已经变化，请取消后重新载入');const tasks=m.tasks.map((t,i)=>({...t,text:document.querySelector('#task-text-'+i).value.trim(),owner:document.querySelector('#task-owner-'+i).value.trim(),due:document.querySelector('#task-due-'+i).value.trim()}));if(tasks.some(t=>!t.text))return fail('事项说明不能为空；负责人和期限可以留空');m.version++;m.summary=text;m.tasks=tasks;m.versions.push({v:m.version,text,tasks:tasks.map(t=>({...t}))});log('保存更正，不重发',m.id+' v'+m.version+' · '+reason);S.modal=null;render();return}
if(a==='add-share'){const m=S.records.find(x=>x.id===S.selected);if(!canEdit(m))return fail('没有共享权限');const subject=document.querySelector('#share-user').value;if(m.grants.some(g=>g.active&&g.subject===subject))return fail('已存在该查看授权');m.grants.push({id:'g'+Date.now(),subject,by:S.phone,active:true});log('共享只读查看权',m.id+' · '+subject+'；未发群');show('share');return}if(a.startsWith('revoke:')){const m=S.records.find(x=>x.id===S.selected),g=m?.grants.find(g=>g.id===a.slice(7));if(!canEdit(m)||g?.by!==S.phone)return fail('不能撤销其他来源授权');g.active=false;log('撤销本人授出的查看权',m.id);show('share');return}
if(a==='admin-in'){S.admin=true;render();return}if(a==='admin-out'){S.admin=false;render();return}if(a.startsWith('admin-tab:')){if(!S.admin)return;S.adminTab=a.slice(10);render();return}if(a.startsWith('toggle-user:')){if(!S.admin)return;const u=user(a.slice(12));u.active=!u.active;log('修改账号状态',u.name+' '+(u.active?'启用':'停用'));render();return}if(a==='sync-org'){if(!S.admin)return;log('模拟组织同步','部门未变；不修改历史会议或扩大访问');render();toast('已完成模拟同步；未访问企业微信');return}if(a.startsWith('role:'))return show('role',a.slice(5));if(a.startsWith('group:')){if(S.admin)return show('group',a.slice(6));return}if(a==='save-group'){if(!S.admin)return;S.groups[0].members=[...document.querySelectorAll('[name=group-member]:checked')].map(e=>e.value);log('变更访问组成员',S.groups[0].members.join('、'));S.modal=null;render();return}
if(a.startsWith('route:')){if(S.admin)return show('route',a.slice(6));return}if(a==='save-route'){if(!S.admin)return;S.routes[S.modal.id]=document.querySelector('#route-target').value;log('修改新会议路由',deptName(S.modal.id));S.modal=null;render();return}if(a==='global-pause'){if(!S.admin)return;S.pause=!S.pause;log(S.pause?'全局应急停发':'恢复自动发送','不改变既有成功目标');render();return}
if(a.startsWith('recover:')){if(S.admin)return show('recover',a.slice(8));return}if(a==='save-recover'){if(!S.admin)return;const reason=document.querySelector('#recovery-reason').value.trim();if(!reason)return fail('请填写处理依据');const m=S.records.find(x=>x.id===S.modal.id);if(m.state==='UNKNOWN'){m.sent=true;m.progress=4;m.state='ACCEPTED';m.manualResolution=true;log('人工核对渠道接收（模拟）',m.id+' · '+reason)}else{m.scenario='normal';m.target=S.routes[m.dept];if(m.snapshot)m.snapshot.target=m.target;m.state=m.progress>=3?'READY':m.progress===2?'TRANSCRIBED':'ARCHIVED';log('恢复失败阶段',m.id+' · '+reason)}S.modal=null;render();return}
if(a==='message-demo')return show('message');if(a==='notes')return show('notes');if(a==='save-note'){const text=document.querySelector('#note-text').value.trim();if(!text)return fail('请填写意见');S.notes.push({page:pageId(),text});try{localStorage.setItem('yanxu03-notes',JSON.stringify(S.notes))}catch{}show('notes');return}if(a==='export-notes'){const blob=new Blob(['# 原型v0.3评审意见\n\n'+S.notes.map(n=>n.page+'：'+n.text).join('\n\n')],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='言序_v0.3_评审意见.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='close'){S.modal=null;S.error='';render()}}
function render(){const scroll=scrollY;document.querySelector('#app').innerHTML=app();document.querySelectorAll('[data-act]').forEach(e=>e.addEventListener('click',()=>act(e.dataset.act)));document.querySelector('#scenario')?.addEventListener('change',e=>{S.scenario=e.target.value;if(S.scenario==='offline')S.online=false;render()});document.querySelector('#capture-dept')?.addEventListener('change',e=>{S.dept=e.target.value});scrollTo(0,scroll)}
setInterval(()=>{if(S.phase==='recording'){S.seconds++;const el=document.querySelector('#timer');if(el)el.textContent=fmt(S.seconds)}},1000);
setInterval(()=>{let changed=false;for(const m of S.records){if(!m.id.startsWith('rec')||m.sent)continue;const old=m.state+':'+m.progress+':'+m.attempts;advance(m);if(old!==m.state+':'+m.progress+':'+m.attempts)changed=true}if(changed&&!S.modal)render()},1600);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}if(e.key==='Tab'&&S.modal){const nodes=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select,.dialog textarea')].filter(n=>!n.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.Proto3={get state(){return S},render,act,advance,canRead,finishSave};
if(location.hash==='#phone')S.mode='phone';if(location.hash==='#admin')S.mode='admin';render();
</script></body></html>
