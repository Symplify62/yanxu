server {
    listen 80;
    server_name test-yanxu.qjl666.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/yanxu-test; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name test-yanxu.qjl666.xyz;
    ssl_certificate /etc/letsencrypt/live/test-yanxu.qjl666.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-yanxu.qjl666.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ {
        alias /opt/yanxu-test/current/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /internal/ {
        limit_conn yanxu_test_conn 8;
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:5199;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location ~ ^/api/voice-enrollments/[A-Za-z0-9-]+/audio$ {
        limit_conn yanxu_test_conn 8;
        limit_req zone=yanxu_test_api burst=20 nodelay;
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:5199;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location / {
        limit_conn yanxu_test_conn 8;
        limit_req zone=yanxu_test_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5199;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
}
